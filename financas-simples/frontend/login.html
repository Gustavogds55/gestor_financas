<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Finanças</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>💰 Finanças</h1>
      <p class="subtitle">Entre na sua conta para continuar</p>

      <div id="msg" class="msg"></div>

      <form id="form-login">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" id="btn-submit">Entrar</button>
      </form>

      <p style="text-align:center; margin-top:20px; font-size:.9rem; color:var(--muted)">
        Não tem conta? <a href="register.html">Cadastre-se</a>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Redireciona se já estiver logado
    if (localStorage.getItem('token')) location.href = 'dashboard.html';

    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const data = await api.post('/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });

        // Salva token e dados do usuário
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        location.href = 'dashboard.html';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg error';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
